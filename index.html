<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Board | Codebreakers</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="header">
    <div class="container header-container">
      <div>
        <h1>Student Task Board</h1>
        <p class="subtitle">Track coursework, lab assignments, and project deliverables.</p>
      </div>
      <button id="toggleFormBtn" class="btn btn-primary">+ Add New Task</button>
    </div>
  </header>

  <main class="container main-content">

    <!-- Task Creation Form (Hidden by Default) -->
    <section id="taskFormContainer" class="task-form-container hidden">
      <form id="newTaskForm" class="task-form">
        <h3>Create New Assignment Task</h3>
        <div class="form-row">
          <div class="form-group flex-2">
            <label for="taskTitle">Task Title</label>
            <input type="text" id="taskTitle" placeholder="e.g. Database Lab 3 Assignment" required>
          </div>
          <div class="form-group flex-1">
            <label for="taskCategory">Course / Subject</label>
            <input type="text" id="taskCategory" placeholder="e.g. Software Eng, Math" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="taskDue">Due Date</label>
            <input type="date" id="taskDue" required>
          </div>
          <div class="form-group flex-1">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="low">Low Priority</option>
              <option value="medium" selected>Medium Priority</option>
              <option value="high">High Priority</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label for="taskStatus">Initial Column</label>
            <select id="taskStatus">
              <option value="todo" selected>To Do</option>
              <option value="inprogress">In Progress</option>
              <option value="done">Completed</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Task</button>
          <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Kanban Columns Board -->
    <div class="board-grid">

      <!-- Column: To Do -->
      <section class="board-column" data-status="todo">
        <div class="column-header">
          <h2>To Do</h2>
          <span class="count-badge" id="countTodo">0</span>
        </div>
        <div class="cards-container" id="todoContainer"></div>
      </section>

      <!-- Column: In Progress -->
      <section class="board-column" data-status="inprogress">
        <div class="column-header">
          <h2>In Progress</h2>
          <span class="count-badge" id="countInProgress">0</span>
        </div>
        <div class="cards-container" id="inProgressContainer"></div>
      </section>

      <!-- Column: Done -->
      <section class="board-column" data-status="done">
        <div class="column-header">
          <h2>Completed</h2>
          <span class="count-badge" id="countDone">0</span>
        </div>
        <div class="cards-container" id="doneContainer"></div>
      </section>

    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <p>Built with Vanilla JS & LocalStorage &bull; Maintained by <strong>Codebreakers</strong></p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
